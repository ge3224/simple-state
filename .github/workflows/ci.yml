name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run type check
        run: deno task typecheck

      - name: Run tests with coverage
        run: deno task test:coverage

      - name: Build
        run: deno task build
